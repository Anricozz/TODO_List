<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FocusList - 注册或登入后管理属于你自己的待办清单"
    />
    <title>FocusList · 登入</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script
      src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"
      defer
    ></script>
    <script src="./js/config.js" defer></script>
    <script src="./js/api.js" defer></script>
    <script src="./js/auth.js" defer></script>
  </head>
  <body class="auth-body">
    <a class="skip-link" href="#auth-main">跳到主要内容</a>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <main id="auth-main" class="auth-shell">
      <section class="auth-card">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <i data-lucide="check-check"></i>
          </span>
          <span>FocusList</span>
        </div>

        <div class="auth-heading">
          <p class="eyebrow">ACCOUNT</p>
          <h1 id="auth-title">登入你的清单</h1>
          <p id="auth-subtitle" class="auth-subtitle">
            登入后只能看到属于你自己的待办。
          </p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="登入或注册">
          <button
            class="auth-tab is-active"
            type="button"
            role="tab"
            data-mode="login"
            aria-selected="true"
          >
            登入
          </button>
          <button
            class="auth-tab"
            type="button"
            role="tab"
            data-mode="register"
            aria-selected="false"
          >
            注册
          </button>
        </div>

        <form id="auth-form" class="auth-form" novalidate>
          <label class="field">
            <span>用户名 <small>3-50 个字符</small></span>
            <input
              id="auth-username"
              type="text"
              autocomplete="username"
              maxlength="50"
              placeholder="例如：focus_user"
              required
            />
          </label>

          <label class="field">
            <span>密码 <small>6-128 个字符</small></span>
            <input
              id="auth-password"
              type="password"
              autocomplete="current-password"
              maxlength="128"
              placeholder="请输入密码"
              required
            />
          </label>

          <p id="auth-error" class="form-error" role="alert"></p>

          <button id="auth-submit" class="button button--primary" type="submit">
            <span id="auth-submit-label">登入</span>
            <i data-lucide="arrow-right" aria-hidden="true"></i>
          </button>
        </form>

        <p class="auth-note">
          登录凭证最长 6 分钟后失效，失效后需要重新登入，不会自动登入。
        </p>
      </section>
    </main>
  </body>
</html>
